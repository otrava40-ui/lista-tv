name: Actualizar lista de canales

concurrency:
  group: lista
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - canales.txt

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar lista
        run: python generar_lista.py
      - name: Guardar cambios
        run: |
          git config user.name "lista-bot"
          git config user.email "lista-bot@users.noreply.github.com"
          git add lista.m3u8 problemas.txt
          git diff --cached --quiet || git commit -m "Actualizar lista de canales"
          git pull --rebase && git push
      - name: Avisar si faltan canales
        run: |
          cat problemas.txt || true
          if grep -q "❌" problemas.txt; then
            exit 1
          fi
